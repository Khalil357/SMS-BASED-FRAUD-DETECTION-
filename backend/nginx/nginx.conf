limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;

upstream sms_fraud_backend {
    server app:8080;
    keepalive 32;
}

# HTTP remains available only for ACME renewal and HTTPS redirection.
server {
    listen 80 default_server;
    server_name 54.242.107.64;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 54.242.107.64;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/54.242.107.64/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.242.107.64/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn per_ip_connections 20;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = /actuator/health {
        proxy_pass http://sms_fraud_backend;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://sms_fraud_backend;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://sms_fraud_backend;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}

# Private container-only probe avoids certificate hostname issues in Docker.
server {
    listen 8081;
    server_name localhost;
    access_log off;

    location = /actuator/health {
        proxy_pass http://sms_fraud_backend;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}

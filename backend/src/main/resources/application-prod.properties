# Production schema changes are applied from src/main/resources/db/migration.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Redis-backed OTP storage survives application restarts.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

spring.jpa.open-in-view=false
# The application is reachable only through the trusted Compose Nginx service.
server.forward-headers-strategy=framework
# SMTP is optional and should not take the API out of service when unconfigured.
management.health.mail.enabled=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

spring.application.name=smsfraud

# App Configuration
app.name=SMS Fraud Detection
app.url=${APP_URL:http://localhost:8080}
# Public URL of the admin web portal (used for the "sign in" link in emails).
app.web-url=${APP_WEB_URL:https://d2wma51qvc2c0y.cloudfront.net/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Optional bootstrap administrator. Never enable this with example credentials.
app.seed-admin.enabled=${ADMIN_SEED_ENABLED:false}
app.seed-admin.email=${ADMIN_EMAIL:}
app.seed-admin.phone=${ADMIN_PHONE:}
app.seed-admin.password=${ADMIN_PASSWORD:}

# ---- JWT ----
# HS256 secret must be at least 32 bytes. Override in production via env.
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes!}
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# ---- Datasource (PostgreSQL) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sms_fraud}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sms_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sms_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Flyway ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.flyway.enabled=false

# Actuator is used by the container health check; only health is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- ML fraud-classification service ----
ml.service.url=${ML_SERVICE_URL:https://13.53.200.176}
# Obtain ML_SERVICE_API_KEY from Barthez. Do not commit the key.
ml.service.api-key=${ML_SERVICE_API_KEY:}
# Emergency compatibility switch for gateways with invalid certificates.
# Keep false outside explicitly approved environments.
ml.service.insecure-tls=${ML_SERVICE_INSECURE_TLS:false}

# ---- Jackson: map frontend snake_case JSON onto record fields ----
spring.jackson.property-naming-strategy=SNAKE_CASE

# ---- Email (SMTP) ----
# Which EmailService bean is active: "smtp" (default) or "resend".
email.provider=${EMAIL_PROVIDER:smtp}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
email.from=${EMAIL_FROM:noreply@smsfraud.com}
email.support=support@smsfraud.com

# Resend (only used when email.provider=resend)
resend.api-key=${RESEND_API_KEY:}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- SMS provider ----
# Meseji SMS Configuration (https://www.meseji.co.tz)
meseji.api-key=${MESEJI_API_KEY:}
meseji.sender-id=${MESEJI_SENDER_ID:MESEJI}
meseji.base-url=${MESEJI_BASE_URL:https://meseji.co.tz/api/v1}

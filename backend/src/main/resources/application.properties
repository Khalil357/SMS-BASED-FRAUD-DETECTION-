spring.application.name=smsfraud

# App Configuration
app.name=SMS Fraud Detection
app.url=http://localhost:8080

# ---- JWT ----
# HS256 secret must be at least 32 bytes. Override in production via env.
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes!}
app.jwt.expiration=900000

# ---- Datasource (PostgreSQL) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sms_fraud}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sms_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sms_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Flyway ----
# Flyway disabled for dev — run V1__init.sql manually in pgAdmin as postgres.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.flyway.enabled=false

# ---- Jackson: map frontend snake_case JSON onto record fields ----
spring.jackson.property-naming-strategy=SNAKE_CASE

# Email Configuration
email.from=noreply@smsfraud.com
email.support=support@smsfraud.com

# Spring Mail Configuration (best-effort; OTPs also returned in the API response)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

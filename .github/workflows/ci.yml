name: CI

# Security posture, in layers:
#   - gitleaks  : SAST — scans git HISTORY for leaked secrets/keys.
#   - backend-test / web-client-build : compile + unit tests (with a real Postgres).
#   - build-push: publish images to Docker Hub (push events only, so fork PRs
#                 never receive secrets).
#   - dast      : DAST — OWASP ZAP baseline scan against the RUNNING backend.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

#jobs:
#  # ─── SAST: leaked secrets in git history ────────────────────────────────────
#  secret-scan:
#    name: Gitleaks secret scan
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@v4
#        with:
#          fetch-depth: 0 # full history so we catch secrets committed long ago
#
#      - name: Run gitleaks
#        uses: gitleaks/gitleaks-action@v2
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Backend: compile + test ────────────────────────────────────────────────
  backend-test:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sms_fraud
          POSTGRES_USER: sms_app
          POSTGRES_PASSWORD: sms_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sms_fraud
          SPRING_DATASOURCE_USERNAME: sms_app
          SPRING_DATASOURCE_PASSWORD: sms_pass
        run: ./mvnw --batch-mode --no-transfer-progress verify

  # ─── Web client: type-check + build ─────────────────────────────────────────
  web-client-build:
    name: Web client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install dependencies
        working-directory: web-client
        run: npm ci

      - name: Build
        working-directory: web-client
        run: npm run build

  # ─── Build & push images (push events only) ─────────────────────────────────
  build-push:
    name: Build & push Docker images
    needs: [backend-test, web-client-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/argus-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/argus-backend:${{ github.sha }}

      - name: Build & push web-client
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/argus-web-client:latest
            ${{ vars.DOCKERHUB_USERNAME }}/argus-web-client:${{ github.sha }}

  # ─── DAST: OWASP ZAP against the running backend ────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    needs: [backend-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sms_fraud
          POSTGRES_USER: sms_app
          POSTGRES_PASSWORD: sms_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sms_fraud
          SPRING_DATASOURCE_USERNAME: sms_app
          SPRING_DATASOURCE_PASSWORD: sms_pass
        run: |
          ./mvnw --batch-mode spring-boot:run > backend.log 2>&1 &
          echo "backend starting"

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
              echo "backend ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become ready"; tail -n 100 backend/backend.log; exit 1

      - name: ZAP API scan (OpenAPI)
        uses: zaproxy/action-api-scan@v0.4.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: openapi
          fail_action: 'false' # report only; tighten to true once noise is triaged

name: Backend CI/CD to EC2

# Required repository secrets: DOCKERHUB_TOKEN, EC2_HOST, EC2_USER, EC2_SSH_KEY.
# Required repository variable: DOCKERHUB_USERNAME (must have push access to
# alexanderjames101/sms-fraud-backend). The server host key is pinned below.

on:
  push:
    branches: [front_end]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

# Do not let two releases retag/recreate the production app concurrently.
concurrency:
  group: backend-ec2-production
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/front_end'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sms_fraud
          POSTGRES_USER: sms_app
          POSTGRES_PASSWORD: sms_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms_app -d sms_fraud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sms_fraud
          SPRING_DATASOURCE_USERNAME: sms_app
          SPRING_DATASOURCE_PASSWORD: sms_pass
        run: ./mvnw --batch-mode --no-transfer-progress verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish tested backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: alexanderjames101/sms-fraud-backend:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend app only
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: SHA256:TcOUj41t6D1HWIOTSivX1sTy72fE/qNQVfl3cZtcEZA
          envs: DEPLOY_SHA,EC2_HOST
          command_timeout: 15m
          script_path: .github/scripts/deploy-backend.sh

  promote-latest:
    # Keep Docker Hub :latest on the last release that passed EC2 health checks.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Point latest at the healthy release
        run: >-
          docker buildx imagetools create
          --tag alexanderjames101/sms-fraud-backend:latest
          alexanderjames101/sms-fraud-backend:${{ github.sha }}

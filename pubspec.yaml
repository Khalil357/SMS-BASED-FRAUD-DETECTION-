name: sms_based_fraud_detection
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  telephony: ^0.2.0
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - frontend/assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "frontend/assets/images/sms_fraud_app_icon.png"

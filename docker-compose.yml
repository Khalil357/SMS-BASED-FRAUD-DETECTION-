version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sms_fraud
      POSTGRES_USER: sms_app
      POSTGRES_PASSWORD: sms_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro

  ml-service:
    build:
      context: .
      dockerfile: ml-service.Dockerfile
    environment:
      MODEL_DIR: /app/final_model
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sms_fraud
      SPRING_DATASOURCE_USERNAME: sms_app
      SPRING_DATASOURCE_PASSWORD: sms_pass
      ML_SERVICE_URL: http://ml-service:8000
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - ml-service
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db_data:
    driver: local
